graphhopper:
  datareader.file: /data/map.osm.pbf
  graph.location: /data/cache

  # TODO: remove some ways
  import.osm.ignored_highways: |
    motorway, trunk, primary, secondary, busway,
    motorway_link, trunk_link, primary_link, secondary_link,
    cycleway

  profiles:
    - name: foot
      custom_model_files: [foot.json, foot_elevation.json]

  profiles_ch:
    - profile: foot

  graph.encoded_values: |
    foot_access, foot_average_speed, foot_priority, foot_road_access,
    hike_rating, average_slope,
    country, road_class, mtb_rating

  graph.elevation.provider: srtm


# Dropwizard server configuration
server:
  application_connectors:
  - type: http
    port: 8989
    # for security reasons bind to localhost
    # bind_host: localhost
    # bind_host: localhost
    # increase GET request limit - not necessary if /maps UI is not used or used without custom models
    max_request_header_size: 50k
  request_log:
      appenders: []
  # admin_connectors:
  # - type: http
  #   port: 8990
  #   # bind_host: localhost
  #   # bind_host: localhost
# See https://www.dropwizard.io/en/latest/manual/core.html#logging
logging:
  appenders:
    - type: file
      time_zone: UTC
      current_log_filename: logs/graphhopper.log
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      archive: true
      archived_log_filename_pattern: ./logs/graphhopper-%d.log.gz
      archived_file_count: 30
      never_block: true
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: DEBUG
      additive: false
      appenders:
        - type: file
          currentLogFilename: logs/osm_warnings.log
          archive: false
          logFormat: '[%level] %msg%n'
